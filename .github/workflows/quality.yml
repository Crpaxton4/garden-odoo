name: Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node.js dependencies
        run: npm ci

      - name: Black (formatting)
        run: black --check src devops

      - name: isort (import order)
        run: isort --check-only src

      - name: ESLint
        run: npx eslint .

      - name: Prettier
        run: npx prettier --check "**/*.{js,css,scss,xml,html,md,yml,yaml,json}"

      - name: Stylelint
        run: npx stylelint --allow-empty-input "**/*.{css,scss}"

      - name: markdownlint
        run: npx markdownlint-cli2 "**/*.md" "#node_modules"
