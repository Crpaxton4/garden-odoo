name: Coverage

on:
  push:
    branches: [main]
    paths:
      - "**.py"
  pull_request:
    branches: [main]
    paths:
      - "**.py"

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

# TODO: This workflow requires an Odoo 19.0 runtime environment (PostgreSQL,
# Odoo source). Update the `services`, `env`, and test commands below once the
# project has installable modules and a known deployment image.

jobs:
  test:
    name: Tests + Coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: odoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U odoo"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      # TODO: Set ODOO_BIN to the path of odoo-bin in your environment
      ODOO_BIN: odoo-bin
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: odoo
      PGPASSWORD: odoo

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      # TODO: Install Odoo 19.0 and its Python dependencies here.
      # Example using pip:
      #   pip install -e /path/to/odoo
      # Example using a pre-built container:
      #   Replace `runs-on` with a container image that includes Odoo.

      - name: Discover test tags
        id: tags
        run: |
          # Build --test-tags from directories containing __manifest__.py
          # Fallback to "/" (all tests) when no modules are found
          TAGS=$(find . -maxdepth 2 -name "__manifest__.py" -printf '/%h\n' \
                 | sed 's|^\./||' | paste -sd, -)
          echo "tags=${TAGS:-/}" >> "$GITHUB_OUTPUT"

      - name: Erase stale coverage data
        run: python3 -m coverage erase

      - name: Run tests with coverage
        run: |
          python3 -m coverage run \
            "$ODOO_BIN" \
            -d test_coverage \
            --test-enable \
            --test-tags "${{ steps.tags.outputs.tags }}" \
            --stop-after-init \
            --log-level=error \
            --no-http

      - name: Coverage report (terminal)
        run: python3 -m coverage report

      - name: Coverage HTML report
        if: always()
        run: python3 -m coverage html

      - name: Coverage XML report
        if: always()
        run: python3 -m coverage xml

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 14

      - name: Upload XML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14
